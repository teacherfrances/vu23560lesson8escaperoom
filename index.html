<!DOCTYPE html>

<title>Stuck in the Giant Tree: a Christmas escape room</title>
<style>
:root{

  --gold:#F2C14E; --gold2:#ffe39a; --red:#D7263D; --green:#1E9E4F; --green-d:#0f5c2e; --pine:#14532d; --pine-d:#0c2e1b;

}
*{box-sizing:border-box}
html{font-size:30px}
html.s0{font-size:24px} html.s1{font-size:30px} html.s2{font-size:36px} html.s3{font-size:42px}

body{margin:0;min-height:100vh;font-family:var(--body);color:var(--ink);line-height:1.3;
  background:radial-gradient(ellipse at 50% -10%,#2a3f7a 0%,var(--night2) 35%,var(--night) 75%) fixed;
  padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{touch-action:manipulation;overflow-x:clip;max-width:100%}
button,[role=button]{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:4px solid var(--gold);outline-offset:3px}
.disp{font-family:var(--disp);font-weight:700}
#sky{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#sky i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.6;animation:tw 3s ease-in-out infinite}
@keyframes tw{50%{opacity:.1}}

/* top bar */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:6px 10px;background:rgba(6,12,30,.92);border-bottom:4px solid var(--gold);flex-wrap:wrap}
.brand{font-family:var(--disp);font-weight:700;font-size:18px;color:var(--gold);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1 1 8rem;min-width:0}
.clock{font-family:var(--mono);font-weight:700;background:var(--red);color:#fff;border-radius:999px;padding:2px 10px;font-size:18px;white-space:nowrap}
.tb{background:#fff;color:#111;border:0;border-radius:8px;font-weight:700;font-size:18px;min-height:44px;min-width:44px;padding:0 10px}
.saved{font-size:14px;color:var(--gold2);opacity:0;transition:opacity .3s;white-space:nowrap}
.saved.on{opacity:1}

main{position:relative;z-index:1;max-width:1450px;margin:0 auto;padding:.7rem .8rem 2rem}
.row{display:flex;flex-wrap:wrap;gap:.5em;align-items:center}
.center{text-align:center}
.muted{color:var(--soft)}
.small{font-size:.8em}

/* buttons */
.bb{border:3px solid #fff;background:transparent;color:#fff;font-weight:700;min-height:max(2.2em,48px);padding:.1em 1em;border-radius:999px}
.bb.gold{background:var(--gold);border-color:var(--gold);color:#141414}
.bb.red{background:var(--red);border-color:var(--red);color:#fff}
.bb.green{background:var(--green);border-color:var(--green);color:#fff}
.bb.dark{border-color:#141414;color:#141414}
.bb[disabled]{opacity:.4;cursor:default}

/* cards */
.panel{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);border-radius:18px;padding:.8em 1em;margin:.6em 0}
.paper{background:var(--card);color:var(--cardink);border-radius:18px;padding:.9em 1.1em;border-bottom:10px solid var(--gold);box-shadow:0 8px 0 rgba(0,0,0,.25)}
.title{font-family:var(--disp);font-weight:700;font-size:2em;line-height:1.1;margin:.1em 0;color:var(--gold);overflow-wrap:break-word}
.sub{font-size:1.1em}
.warn{background:var(--bad-t);color:#141414;border-left:10px solid var(--bad);border-radius:10px;padding:.4em .7em;margin:.5em 0}
.welcome{background:var(--gold);color:#141414;border-radius:14px;padding:.5em .8em;margin:.5em 0;font-weight:700}

/* start screen */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1em;align-items:center}
@media (max-width:820px){.hero{grid-template-columns:minmax(0,1fr)}}
.story p{margin:.35em 0}
.gname{font:inherit;border:3px solid #141414;border-radius:12px;min-height:48px;padding:.1em .6em;width:100%;max-width:20em}

/* tree */
.treewrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:1em;align-items:start}
@media (max-width:820px){.treewrap{grid-template-columns:minmax(0,1fr)}}
.treebox{max-width:560px;margin:0 auto;width:100%}
.treebox svg{width:100%;height:auto;display:block}
.tier{cursor:pointer}
.tier polygon{stroke:#0a2414;stroke-width:3}
.tier.lock polygon{fill:var(--pine-d)}
.tier.open polygon{fill:var(--green);animation:pulse 1.6s ease-in-out infinite}
.tier.done polygon{fill:var(--pine)}
@keyframes pulse{50%{fill:#27b85f}}
.tier text{font-family:var(--disp);font-weight:700;font-size:22px;fill:#fff;text-anchor:middle;dominant-baseline:middle;pointer-events:none}
.tier.lock text{fill:#7b9b86}
.bulb{animation:tw 1.4s ease-in-out infinite}
.star{transition:fill .5s}
.levels{display:flex;flex-direction:column-reverse;gap:.35em}
.lv{display:flex;align-items:center;gap:.6em;width:100%;text-align:left;border:3px solid rgba(255,255,255,.35);background:rgba(255,255,255,.06);border-radius:14px;padding:.3em .6em;min-height:max(2.4em,52px);color:#fff}
.lv .n{font-family:var(--disp);font-weight:700;min-width:1.8em;height:1.8em;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.15);flex:none}
.lv .em{font-size:1.3em;flex:none}
.lv .t{flex:1;min-width:0}
.lv .t b{display:block;font-family:var(--disp)}
.lv .t span{font-size:.8em;color:var(--soft)}
.lv .st{flex:none;font-weight:700}
.lv.open{border-color:var(--gold);background:rgba(242,193,78,.18)}
.lv.open .n{background:var(--gold);color:#141414}
.lv.done{border-color:var(--green)}
.lv.done .n{background:var(--green)}
.lv.lock{opacity:.55;cursor:default}
.lv.star{border-color:var(--gold)}
.letters{display:flex;flex-wrap:wrap;gap:.3em;margin:.4em 0}
.lt{width:2em;height:2.3em;border-radius:50% 50% 45% 45%;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:1.05em;background:rgba(255,255,255,.12);border:2px dashed rgba(255,255,255,.35);position:relative}
.lt.got{border:0;color:#141414;box-shadow:inset -4px -4px 0 rgba(0,0,0,.18)}
.lt::before{content:"";position:absolute;top:-.35em;left:50%;width:.5em;height:.35em;margin-left:-.25em;background:#bbb;border-radius:3px 3px 0 0}

/* room */
.rhead{display:flex;align-items:center;gap:.5em;margin-bottom:.4em}
.rhead .em{font-size:1.8em;line-height:1;flex:none}
.rhead .rt{flex:1 1 auto;min-width:0}
.rhead .rt b{display:block;font-family:var(--disp);font-size:1.25em;line-height:1.15;color:var(--gold);overflow-wrap:normal;word-break:normal}
.rhead .rt span{display:block;line-height:1.2}
.rhead .backbtn{flex:none}
@media (max-width:620px){.baubles{gap:.2em}.bau{font-size:.55em}.top .brand{font-size:15px;flex-basis:100%}.top .lbl{display:none}.saved{display:none}.top .clock{margin-right:auto}
.rhead .backbtn{display:none}.rhead .em{font-size:1.4em}.rhead .rt b{font-size:1.05em}.rhead .rt span{font-size:.85em}}
.baubles{display:grid;grid-template-columns:repeat(10,minmax(0,1.9em));gap:.3em;margin:.6em auto .6em;justify-content:center}
.bau{width:100%;aspect-ratio:1/1.13;height:auto;border-radius:50% 50% 46% 46%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.3);position:relative;display:flex;align-items:center;justify-content:center;font-size:.7em;font-weight:700;color:var(--soft)}
.bau::before{content:"";position:absolute;top:-.4em;left:50%;width:.6em;height:.4em;margin-left:-.3em;background:#c9c9c9;border-radius:3px 3px 0 0}
.bau.lit{border:0;color:#fff;box-shadow:0 0 14px 3px rgba(255,227,154,.7)}
.bau.cur{border:3px solid var(--gold);color:#fff}
.quote{display:flex;flex-wrap:wrap;gap:.4em;align-items:flex-start;margin:.3em 0 .5em}
.quote .who{background:#141414;color:#fff;border-radius:999px;padding:.15em .7em;font-weight:700;flex:none}
.quote .bub{background:#FFF0D2;border:3px solid #141414;border-radius:16px;padding:.3em .8em;font-weight:700;font-size:1.15em;flex:1 1 10em;min-width:0;overflow-wrap:break-word}
.q{font-family:var(--disp);font-weight:700;font-size:1.35em;line-height:1.25;margin:.2em 0 .5em;overflow-wrap:break-word}
.qn{font-weight:700;color:var(--mid);font-size:.85em}
.opt{display:flex;gap:.6em;align-items:center;width:100%;text-align:left;border:3px solid #141414;background:#fff;color:#141414;min-height:max(2.3em,54px);padding:.3em .8em;margin:.4em 0;border-radius:14px;font-size:1.1em}
.opt .L{flex:none;width:1.7em;height:1.7em;border-radius:50%;background:var(--red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85em}
.opt .tx{min-width:0;overflow-wrap:break-word}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.right .L{background:#fff;color:var(--ok)}
.opt.wrong{background:repeating-linear-gradient(45deg,#f1d6d9 0 8px,#e8c3c7 8px 16px)}
.opt.wrong .tx{text-decoration:line-through}
.opt[disabled]{cursor:default}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.6em}
.two .opt{justify-content:center;font-size:1.3em;font-weight:700;min-height:3em}
.four{display:grid;grid-template-columns:repeat(4,1fr);gap:.5em}
.four .opt,.three .opt{justify-content:center;font-family:var(--mono);font-weight:700;font-size:1.4em}
.three{display:grid;grid-template-columns:repeat(3,1fr);gap:.5em}
@media (max-width:520px){.four{grid-template-columns:1fr 1fr}.two .opt{font-size:1.1em}}
.big{font-family:var(--disp);font-weight:700;font-size:2.4em;text-align:center;margin:.2em 0;letter-spacing:.02em;overflow-wrap:break-word}
.fb{border-radius:12px;padding:.4em .8em;margin:.4em 0;font-size:1.05em}
.fb.good{background:var(--ok-t);border-left:10px solid var(--ok);color:#141414}
.fb.bad{background:var(--bad-t);border-left:10px solid var(--bad);color:#141414}
.fb b{display:block}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.snip{border:3px solid #141414;border-radius:12px;overflow:hidden;margin:.3em 0 .6em;background:#f6f4ef;color:#141414}
.snip .sh{background:#1d1d1d;color:#fff;padding:.2em .6em;font-family:var(--mono);font-size:.75em;overflow-wrap:anywhere}
.snip .sb{padding:.4em .7em;white-space:pre-line;font-size:.95em;overflow-wrap:anywhere}
.snip .sb b{font-family:var(--disp)}
.speak{background:#FFF0D2;border-left:12px solid var(--gold);border-radius:0 12px 12px 0;padding:.5em .8em;margin:.4em 0}
.speak .tag{display:inline-block;background:#141414;color:var(--gold);border-radius:999px;padding:0 .6em;font-weight:700;font-size:.8em}
.speak .ex{font-style:italic;margin-top:.3em}

/* mini browser */
.mock{border:3px solid #141414;border-radius:12px;overflow:hidden;background:#fff;color:#141414;user-select:none;margin:.3em 0}
.mtabs{background:#2d2d2d;display:flex;align-items:flex-end;gap:.25em;padding:.35em .4em 0}
.mtool{background:#e3e3e3;display:flex;gap:.3em;align-items:center;padding:.3em .4em}
.mpage{display:flex}
.mcontent{flex:1;padding:.4em;min-width:0}
.hot{border:3px solid transparent;background:transparent;min-height:44px;padding:.05em .45em;border-radius:8px;color:#141414}
.hot:hover{border-color:#bbb}
.hot.found{border-color:#141414;background:var(--gold)}
.hot.flash{animation:flash .5s}
@keyframes flash{30%{background:#f1d6d9}}
.mtabs .tabc{background:#f2f2f2;border-radius:8px 0 0 0;padding:.3em .5em}
.mtabs .hot.x{background:#f2f2f2;border-radius:0 8px 0 0;margin-left:-.25em;min-width:40px}
.mtabs .hot.plus{color:#fff;min-width:40px}
.hot.addr{flex:1;text-align:left;background:#fff;border-radius:999px;font-family:var(--mono);font-size:.8em;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.mhead{display:flex;flex-wrap:wrap;gap:.3em;align-items:center;justify-content:space-between}
.hot.logo{font-size:1.4em}
.hot.name{font-family:var(--disp);font-weight:700}
.hot.search{border:2px solid #9a9a9a;border-radius:999px;color:#555;font-size:.85em}
.mmenu{display:flex;flex-wrap:wrap;background:#141414;border-radius:6px;margin:.3em 0}
.mmenu .hot{color:#fff;font-weight:700;font-size:.9em}
.mmenu .hot.found{color:#141414}
.mhero{background:#E2F2E7;border-radius:8px;padding:.3em .5em;display:flex;gap:.5em;align-items:center}
.scrollb{width:44px;flex:none;border-left:2px solid #bbb;padding:3px;display:flex}
.scrollb .hot{width:100%;padding:0;display:flex;justify-content:center;align-items:flex-start;background:#eee;min-height:5em}
.scrollb .thumb{display:block;width:60%;height:2em;background:#888;border-radius:3px;margin-top:.3em}
.mnote{font-size:.7em;color:#555;font-style:italic;padding:0 .4em .3em}

/* keypad */
.lockbox{max-width:560px;margin:0 auto}
.codeshow{display:flex;gap:.4em;justify-content:center;margin:.5em 0}
.codeshow span{width:1.7em;height:2em;border:3px solid #141414;border-radius:10px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:1.4em;background:#fff;color:#141414}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:.4em}
.key{border:3px solid #141414;border-radius:14px;background:#fff;color:#141414;font-family:var(--mono);font-weight:700;font-size:1.4em;min-height:2.2em}
.key.ok{background:var(--green);color:#fff;border-color:var(--green)}
.key.clr{background:#eee}
.checklist{margin:.4em 0}
.ckr{display:flex;align-items:center;gap:.5em;padding:.25em 0;border-bottom:2px dashed #ccc}

/* final star */
.tiles{display:flex;flex-wrap:wrap;gap:.4em;justify-content:center;margin:.6em 0}
.ltile{width:2.4em;height:2.7em;border-radius:50% 50% 45% 45%;border:0;font-family:var(--disp);font-weight:700;font-size:1.3em;color:#141414;box-shadow:inset -5px -5px 0 rgba(0,0,0,.18)}
.ltile[disabled]{opacity:.25}
.slots{display:flex;flex-wrap:wrap;gap:.3em;justify-content:center;margin:.4em 0}
.slot{width:1.8em;height:2.1em;border-bottom:4px solid var(--gold);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-weight:700;font-size:1.3em;color:var(--gold)}

/* overlay */
.ov{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:1rem .6rem;overflow:auto}
.ovbox{background:#fff;color:#141414;border-radius:18px;border-bottom:10px solid var(--red);max-width:760px;width:100%;padding:.8rem 1rem}
.ovbox h2{font-family:var(--disp);margin:.1em 0 .4em}

/* fx */
.burst{position:fixed;left:50%;top:45%;z-index:80;font-size:2rem;pointer-events:none;transition:transform 1.1s cubic-bezier(.2,.7,.3,1),opacity 1.1s}
.conf{position:fixed;top:-20px;z-index:85;width:12px;height:18px;pointer-events:none;animation:fall linear forwards}
.snow{position:fixed;top:-2em;pointer-events:none;z-index:0;color:#cfe3ff;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(112vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

}

/* ---------------- room state ---------------- */
/* answer positions with no pattern: no 3 the same in a row, no a-b-c steps, no a-b-a-b, no repeated blocks */
function badSeq(a, k){
  var two = k === 2;
  for(var i = 0; i + 2 < a.length; i++){
    if(a[i] === a[i + 1] && a[i + 1] === a[i + 2]) return true;
    var d1 = a[i + 1] - a[i], d2 = a[i + 2] - a[i + 1];
    if(d1 === d2 && (d1 === 1 || d1 === -1)) return true;
    if(!two && i + 3 < a.length && a[i] === a[i + 2] && a[i + 1] === a[i + 3] && a[i] !== a[i + 1]) return true;
    if(two && i + 4 < a.length && a[i] === a[i + 2] && a[i + 2] === a[i + 4] && a[i + 1] === a[i + 3] && a[i] !== a[i + 1]) return true;
    if(!two && i + 5 < a.length && a[i] === a[i + 3] && a[i + 1] === a[i + 4] && a[i + 2] === a[i + 5]) return true;
    if(i + 7 < a.length && a[i] === a[i + 4] && a[i + 1] === a[i + 5] && a[i + 2] === a[i + 6] && a[i + 3] === a[i + 7]) return true;
  }
  return false;
}
function plan(n, k){
  for(var t = 0; t < 5000; t++){
    var base = []; for(var i = 0; i < n; i++) base.push(i % k);
    var p = shuffle(base); if(!badSeq(p, k)) return p;
  }
  return shuffle(range(n)).map(function(x){ return x % k; });
}
function newRoomState(i){
  var R = ROOMS[i], n = R.items.length, r = {seq:null, n:0, pick:{}, tries:{}, first:0, ord:{}, done:false, unlocked:false, code:""};
  if(R.type === "fixed"){
    for(var t = 0; t < 5000; t++){
      var sq = shuffle(range(n));
      var ans = sq.map(function(ix){ return R.opts.indexOf(R.items[ix].a); });
      if(!badSeq(ans, R.opts.length)){ r.seq = sq; break; }
    }
    if(!r.seq) r.seq = shuffle(range(n));
  } else {
    r.seq = shuffle(range(n));
    if(R.type === "mc"){
      var pos = plan(n, 3);
      r.seq.forEach(function(ix, step){
        var it = R.items[ix], wrong = shuffle(it.d), o = [];
        for(var s = 0, w = 0; s < 3; s++) o.push(s === pos[step] ? it.a : wrong[w++]);
        r.ord[ix] = o;
      });
    }
  }
  return r;
}
function rs(i){
  var r = S.rooms[i];
  if(!r){ r = S.rooms[i] = newRoomState(i); }
  return r;
}
function optsFor(ri, it, idx){
  var R = ROOMS[ri], r = rs(ri);
  if(R.type === "fixed") return R.opts;
  if(!r.ord[idx]) r.ord[idx] = shuffle([it.a].concat(it.d));
  return r.ord[idx];
}

function nextBauble(i){
